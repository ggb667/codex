name: Bazel Windows platform diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  rustls-provider-platform:
    runs-on: windows-latest
    timeout-minutes: 10
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          cache-scope: bazel-windows-platform-diagnostic

      - name: Inspect rustls-provider configured targets
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/run-bazel-ci.sh \
            --windows-cross-compile \
            -- \
            cquery \
            --skip_incompatible_explicit_targets \
            --output=label \
            -- \
            //codex-rs/utils/rustls-provider:rustls-provider-preinstalled-test \
            //codex-rs/utils/rustls-provider:rustls-provider-preinstalled-test-windows-cross
